<style>
  :root { color-scheme: light; }
  * { scrollbar-color: #FFC800 #F1F5F9; }
  body { background: #F9FAFB; }

  .gold-text { background: linear-gradient(100deg, #92400E 0%, #B45309 45%, #78350F 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .glass { background: #FFFFFF; border: 1px solid #E2E8F0; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

  .field { width: 100%; background: #FFFFFF; border: 1px solid #CBD5E1; color: #0F172A; border-radius: .7rem; padding: .7rem .9rem; font-size: .95rem; transition: border-color .2s ease, box-shadow .2s ease, background .2s ease; }
  .field::placeholder { color: rgba(15,23,42,.35); }
  .field:hover { border-color: rgba(255,200,0,.55); }
  .field:focus { outline: none; border-color: #FFC800; box-shadow: 0 0 0 3px rgba(255,200,0,.25); background: #FFFFFF; }
  .field.err { border-color: rgba(220,38,38,.75); box-shadow: 0 0 0 3px rgba(220,38,38,.12); }
  select.field { color-scheme: light; }
  .field-msg { color: #DC2626; font-size: .78rem; margin-top: .35rem; min-height: 1rem; }

  .btn-submit { background: #FFC800; color: #0F172A; transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease; }
  .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -8px rgba(255,200,0,.55); background-color: #E6B400; }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .rule { height: 1px; background: linear-gradient(90deg, rgba(255,200,0,.9), rgba(255,200,0,0)); }

  .reveal { animation: reveal .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes reveal { from { opacity:0; transform:translateY(14px);} to { opacity:1; transform:translateY(0);} }
  .modal-panel { animation: pop .32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(8px);} to { opacity:1; transform:scale(1) translateY(0);} }
  @media (prefers-reduced-motion: reduce) { .reveal, .modal-panel, .tick { animation: none !important; } .progress-fill, .leader-fill { transition: none !important; } .faq-answer, .faq-chevron { transition: none !important; } }

  /* ---- FAQ accordion ---- */
  .faq-item { background: rgba(255,255,255,.5); }
  .faq-question { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
  .faq-answer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .faq-answer > div { overflow: hidden; }
  .faq-chevron { transition: transform .3s ease; }

  /* ---- Recruitment timeline / process steps ---- */
  .step-circle {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .8rem;
    background: #fff; color: rgba(15,23,42,.35);
    border: 2px solid rgba(15,23,42,.12);
  }
  .step-circle-active {
    background: #FFC800; color: #0F172A; border-color: #FFC800;
    animation: stepGlow 2s ease-in-out infinite;
  }
  .step-circle-done {
    background: #16A34A; color: #fff; border-color: #16A34A;
  }
  @keyframes stepGlow {
    0%, 100% { box-shadow: 0 0 0 4px rgba(255,200,0,.22), 0 0 10px rgba(255,200,0,.45); }
    50% { box-shadow: 0 0 0 6px rgba(255,200,0,.3), 0 0 20px rgba(255,200,0,.7); }
  }
  .step-pulse-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #FFC800; flex-shrink: 0;
    animation: stepPulse 1.6s ease-in-out infinite;
  }
  @keyframes stepPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: .5; }
  }
  .step-connector { position: absolute; background: rgba(15,23,42,.12); z-index: 0; }
  .step-connector-v { left: 17px; top: 17px; bottom: 17px; width: 2px; }
  .step-connector-h { left: 12.5%; right: 12.5%; top: 17px; height: 2px; }
  @media (prefers-reduced-motion: reduce) { .step-circle-active, .step-pulse-dot { animation: none !important; } }

  /* ---- Footer social icons ---- */
  .social-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(15,23,42,.15);
    color: rgba(15,23,42,.7);
    transition: background-color .2s ease, color .2s ease, border-color .2s ease, transform .2s ease;
  }
  .social-btn:hover { background: #FFC800; color: #0F172A; border-color: #FFC800; transform: translateY(-2px); }

  /* ---- WhatsApp community notice card ---- */
  .whatsapp-card { background: rgba(37, 211, 102, .06); border: 1px solid rgba(37, 211, 102, .35); border-inline-start: 4px solid #25D366; }

  /* ---- Live activity toast ---- */
  .toast-live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #22C55E; flex-shrink: 0;
    animation: stepPulse 1.5s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .toast-live-dot { animation: none !important; } #liveToast { transition: none !important; } }

  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid #E6B400; outline-offset: 2px; }

  .lang-btn { padding: .35rem .75rem; border-radius: 999px; font-size: .78rem; border: 1px solid #E2E8F0; color: #475569; transition: all .18s ease; white-space: nowrap; cursor: pointer; background: #FFFFFF; }
  .lang-btn.active { background: #FFC800; color:#0F172A; border-color: transparent; font-weight: 600; }
  .lang-btn:hover:not(.active) { border-color: #FFC800; color:#0F172A; }

  .announce-banner { background: linear-gradient(100deg,#FFE866,#FFC800); border-bottom: 2px solid #0F172A; }

  .wave-divider { display: block; width: 100%; height: 14px; line-height: 0; }

  @keyframes tickPulse { 0% { transform: scale(1);} 30% { transform: scale(1.14);} 100% { transform: scale(1);} }
  .tick { animation: tickPulse .35s ease; }

  .progress-track, .leader-track { background: #E2E8F0; border-radius: 999px; overflow: hidden; }
  .progress-fill, .leader-fill { height: 100%; border-radius: 999px; width: 0%; transition: width 3s cubic-bezier(0.25, 1, 0.5, 1); background: linear-gradient(90deg,#FFC800,#FFDD55); will-change: width; }
  .gender-fill-f { background: linear-gradient(90deg,#F472A0,#FBC2D8) !important; }
  .gender-fill-m { background: linear-gradient(90deg,#3B9FE0,#A8D8F7) !important; }

  .dept-chip { display:flex; align-items:center; gap:.75rem; cursor:pointer; }
  .dept-chip input[type="checkbox"] { width:1.05rem; height:1.05rem; accent-color:#FFC800; flex-shrink:0; cursor:pointer; }
  .dept-chip.active { border-color:#FFC800; box-shadow:0 0 0 3px rgba(255,200,0,.2); background:rgba(255,200,0,.08); }
  .dept-chip.disabled { opacity:.4; cursor:not-allowed; }
  .dept-chip.disabled input[type="checkbox"] { cursor:not-allowed; }
  #deptOptions.err-group .dept-chip { border-color: rgba(220,38,38,.75); }

  /* ---- Enactus-style icon badges (leaderboard + gender rows) ---- */
  /* .enactus-icon-badge is an alias of .icon-badge — both classes are applied
     together on every badge, so either selector on its own will style it. */
  .icon-badge, .enactus-icon-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #FFDA4D 0%, #FFC800 60%, #F0B400 100%);
    box-shadow: 0 2px 6px rgba(230, 164, 0, 0.25);
  }
  .icon-badge svg, .enactus-icon-badge svg { width: 40px; height: 40px; color: #0F172A; stroke-width: 1.5px; overflow: visible; }
  @media (min-width: 640px) {
    .icon-badge, .enactus-icon-badge { width: 40px; height: 40px; }
    .icon-badge svg, .enactus-icon-badge svg { width: 46px; height: 46px; }
  }
</style>
</head>

<script>
(function () {
  // ====== CONFIG — the ONLY thing you should edit after real applications come in ======
  // After you receive a new application by email, just lower spotsLeft by 1 (or set isFull
  // to true once you're done). The progress bar % and the waitlist switch both update
  // automatically from this one number — nothing else in the file needs to change.
  var CONFIG = {
    deadlineISO: "2026-09-28T23:59:59+01:00", // Casablanca time (UTC+1) — unused now registration is permanently closed, kept for reference
    isFull: true,                             // registration permanently closed — waitlist mode
    totalSpots: 50,                           // total capacity for this season
    spotsLeft: 0,                             // no seats left — waitlist mode
    leaderboard: [
      { key: "major_english", percent: 85, rank: 1 },
      { key: "major_psych",   percent: 6,  rank: 2 },
      { key: "major_french",  percent: 6,  rank: 3 },
      { key: "major_geo",     percent: 3,  rank: 4 }
    ],
    gender: { female: 74, male: 26 },
    deptChoice: [
      { key: "dept_event",     percent: 40, rank: 1 },
      { key: "dept_marketing", percent: 34, rank: 2 },
      { key: "dept_external",  percent: 20, rank: 3 },
      { key: "dept_pm",        percent: 6,  rank: 4 }
    ],
    academicYear: [
      { key: "year_s3", percent: 46, rank: 1 },
      { key: "year_s5", percent: 31, rank: 2 },
      { key: "year_s1", percent: 17, rank: 3 }
    ]
  };
  // ====== LIVE, NO-DATABASE SEAT COUNTER ======
  // spotsLeft now lives in localStorage so it survives page refreshes on this device/browser.
  // Every time the main registration form is submitted successfully, the count is decremented
  // by 1, the progress bar / texts update instantly (no reload), and — once it hits 0, or the
  // countdown deadline passes — the form automatically swaps to the Waiting List.
  // NOTE: because localStorage is local to each visitor's browser, this is a per-device demo
  // counter, not a real shared count synced across every visitor. Wire it to a real backend
  // (Google Sheets, Firebase, a small API, etc.) if you need one true number for everyone.
  var SPOTS_STORAGE_KEY = "enactusFlshAinChock_waitlist_mode_v2"; // bumped so every visitor's browser immediately re-reads waitlist mode, instead of keeping an old cached seat count

  function loadSpotsLeft() {
    try {
      var stored = localStorage.getItem(SPOTS_STORAGE_KEY);
      if (stored !== null && stored !== "" && !isNaN(parseInt(stored, 10))) {
        return Math.max(0, Math.min(CONFIG.totalSpots, parseInt(stored, 10)));
      }
    } catch (e) { /* localStorage unavailable — fall back to CONFIG default below */ }
    return CONFIG.spotsLeft; // first-ever visit on this device: use the initial value (14)
  }

  function saveSpotsLeft(value) {
    try { localStorage.setItem(SPOTS_STORAGE_KEY, String(value)); } catch (e) { /* ignore */ }
  }

  // Initialize spotsLeft from localStorage (or seed it on first visit)
  CONFIG.spotsLeft = loadSpotsLeft();
  saveSpotsLeft(CONFIG.spotsLeft);
  if (CONFIG.spotsLeft <= 0) {
    CONFIG.spotsLeft = 0;
    CONFIG.isFull = true; // no seats left on this device's last known count → force waitlist
  }

  // Whether the animated "count up" reveal has already played once (page load / first scroll into view).
  // Before it plays, every percentage/seat number below shows 0 on purpose — see revealStats() further down.
  var statsRevealed = false;

  function getProgressPercent() {
    var pct = ((CONFIG.totalSpots - CONFIG.spotsLeft) / CONFIG.totalSpots) * 100;
    return Math.max(0, Math.min(100, Math.round(pct)));
  }

  // Refresh every on-screen number that depends on spotsLeft, instantly, no reload.
  function updateSpotsUI() {
    var n = statsRevealed ? CONFIG.spotsLeft : 0;
    var p = statsRevealed ? getProgressPercent() : 0;
    document.getElementById("progressLabel").textContent = fmt("progressLabel", { p: p });
    document.getElementById("progressSubtext").textContent = fmt("progressSubtext", { n: n });
    document.getElementById("progressFill").style.width = p + "%";
  }

  // Small "pop" pulse on the numbers that just changed, reusing the .tick keyframe already
  // defined in the stylesheet for the countdown digits.
  function pulseTick(id) {
    var el = document.getElementById(id);
    el.classList.remove("tick");
    void el.offsetWidth;
    el.classList.add("tick");
  }

  // Called right after a successful main-form submission: -1 seat, save, refresh UI,
  // and auto-switch to the waiting list the moment seats hit 0.
  function decrementSpotsAndRefresh() {
    if (CONFIG.spotsLeft > 0) {
      CONFIG.spotsLeft -= 1;
      saveSpotsLeft(CONFIG.spotsLeft);
    }
    if (CONFIG.spotsLeft <= 0) {
      CONFIG.spotsLeft = 0;
      CONFIG.isFull = true;
    }
    updateSpotsUI();
    pulseTick("progressLabel");
    pulseTick("progressSubtext");
    renderRegistrationState(); // auto-hides the open form / shows the waitlist form if now full
  }
  // Wraps any inline SVG path-set in the yellow Enactus badge circle.
  function makeBadge(innerPaths) {
    return '<span class="icon-badge enactus-icon-badge" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        innerPaths +
      '</svg>' +
    '</span>';
  }

  // Small decorative sparkle/dot accents (Enactus-style illustration flair) that sit in the
  // empty corners around each main icon, deliberately drifting past the 0-24 viewBox edge so
  // they spill outside the round badge, the way the reference illustrations do.
  function starAt(cx, cy, s) {
    s = s || 2.2;
    var k = +(s * 0.35).toFixed(2);
    return '<path d="M' + cx + ' ' + (cy - s) + ' L' + (cx + k) + ' ' + (cy - k) +
      ' L' + (cx + s) + ' ' + cy + ' L' + (cx + k) + ' ' + (cy + k) +
      ' L' + cx + ' ' + (cy + s) + ' L' + (cx - k) + ' ' + (cy + k) +
      ' L' + (cx - s) + ' ' + cy + ' L' + (cx - k) + ' ' + (cy - k) +
      ' Z" fill="currentColor" stroke="none"/>';
  }
  function dotAt(cx, cy, r) {
    r = r || 0.9;
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="currentColor" stroke="none"/>';
  }

  // One distinct, meaningful line-art icon per department (Lucide-style paths),
  // keyed by the translation key used in CONFIG.leaderboard. A generic trophy
  // is kept as a fallback for any department not explicitly mapped below.
  var DEPT_ICONS = {
    // English Studies → open book (BookOpen) + sparkle flourish
    major_english: makeBadge(
      '<path d="M12 7v14"/>' +
      '<path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>' +
      starAt(24, -1, 2.1) + dotAt(-1, 23, 0.8)
    ),
    // Psychology → brain (Brain) + sparkle flourish

  // ==================================================================================
  // ---- Live stats reveal: smooth count-up numbers + progress-bar fill on scroll ----
  // ==================================================================================
  // Runs ONCE (guarded by statsRevealed), and only once the visitor has actually
  // scrolled the stats section a good way into view (see the IntersectionObserver
  // config below) — never immediately on page load just because the section happens
  // to be present in the DOM. The department bars fill in one after another with a
  // short stagger so the sequence reads as a deliberate, watchable reveal rather than
  // everything jumping at once.
  var STATS_ANIM_MS = 2500;       // 2.5s count-up duration for every number/percentage
  var LEADER_STAGGER_MS = 150;    // delay between each department bar starting its reveal
  var prefersReducedMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

  // Generic smooth count-up for a single number element (used for the staggered
  // department bars, where each row animates independently on its own timer).
  function animateNumber(el, from, to, duration, suffix) {
    if (prefersReducedMotion) { el.textContent = to + suffix; return; }
    var startTime = null;
    function frame(ts) {
      if (startTime === null) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var eased = easeOutCubic(progress);
      el.textContent = Math.round(from + (to - from) * eased) + suffix;
      if (progress < 1) requestAnimationFrame(frame);
      else el.textContent = to + suffix;
    }
    requestAnimationFrame(frame);
  }

  function revealStats() {
    if (statsRevealed) return;
    statsRevealed = true;

    var targetPercent = getProgressPercent();
    var targetSpots = CONFIG.spotsLeft;
    var targetFemale = CONFIG.gender.female;
    var targetMale = CONFIG.gender.male;

    var STAT_LISTS_SELECTOR = "#leaderboardList, #deptChoiceList, #yearList";
    var leaderPercentEls = document.querySelectorAll(STAT_LISTS_SELECTOR.split(", ").map(function (s) { return s + " .leader-percent"; }).join(", "));
    var leaderFillEls = document.querySelectorAll(STAT_LISTS_SELECTOR.split(", ").map(function (s) { return s + " .leader-fill"; }).join(", "));
    var leaderTargets = [];
    leaderPercentEls.forEach(function (el) { leaderTargets.push(parseInt(el.getAttribute("data-target"), 10) || 0); });

    // Main progress bar + gender bars start together (no stagger needed here).
    document.getElementById("progressFill").style.width = targetPercent + "%";
    document.getElementById("genderFillF").style.width = targetFemale + "%";
    document.getElementById("genderFillM").style.width = targetMale + "%";

    // Department bars: staggered, one after another, each with its own bar-fill +
    // its own independent count-up so the sequence visibly cascades down the list.
    leaderFillEls.forEach(function (fillEl, i) {
      var target = leaderTargets[i];
      var percentEl = leaderPercentEls[i];
      var delay = prefersReducedMotion ? 0 : i * LEADER_STAGGER_MS;
      setTimeout(function () {
        fillEl.style.width = target + "%";
        animateNumber(percentEl, 0, target, STATS_ANIM_MS, "%");
      }, delay);
    });

    function setFinalNumbers() {
      document.getElementById("progressLabel").textContent = fmt("progressLabel", { p: targetPercent });
      document.getElementById("progressSubtext").textContent = fmt("progressSubtext", { n: targetSpots });
      document.getElementById("genderPercentF").textContent = targetFemale + "%";
      document.getElementById("genderPercentM").textContent = targetMale + "%";
    }

    // Respect the visitor's OS-level "reduce motion" preference: snap straight to the
    // final numbers, let the bars fill instantly too (the CSS media query above already
    // strips the width transition in that case).
    if (prefersReducedMotion) { setFinalNumbers(); return; }

    var startTime = null;
    function frame(ts) {
      if (startTime === null) startTime = ts;
      var progress = Math.min((ts - startTime) / STATS_ANIM_MS, 1);
      var eased = easeOutCubic(progress);

      var curPercent = Math.round(targetPercent * eased);
      var curSpots = Math.round(targetSpots * eased);

      document.getElementById("progressLabel").textContent = fmt("progressLabel", { p: curPercent });
      document.getElementById("progressSubtext").textContent = fmt("progressSubtext", { n: curSpots });
      document.getElementById("genderPercentF").textContent = Math.round(targetFemale * eased) + "%";
      document.getElementById("genderPercentM").textContent = Math.round(targetMale * eased) + "%";

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        setFinalNumbers(); // snap to exact integers at the very end
      }
    }
    requestAnimationFrame(frame);
  }

  var statsRevealTargets = [document.getElementById("progressSection"), document.getElementById("statsSection")].filter(Boolean);

  if ("IntersectionObserver" in window) {
    // threshold 0.4 + a negative bottom rootMargin: the section must genuinely be
    // scrolled ~40% into the viewport before the reveal fires — so on page load, a
    // section that merely peeks in at the bottom edge of the screen will NOT trigger
    // it immediately; the visitor has to actually scroll for it to play.
    var statsObserver = new IntersectionObserver(
      function (entries) {
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].isIntersecting) {
            revealStats();
            statsObserver.disconnect();
            break;
          }
        }
      },
      { threshold: 0.4, rootMargin: "0px 0px -50px 0px" }
    );
    statsRevealTargets.forEach(function (el) { statsObserver.observe(el); });
  } else {
    // No IntersectionObserver support (very old browser): just reveal on load.
    revealStats();
  }

  // ---- Shared FormSubmit AJAX submission ----
  // Any seat-count change is handled by the caller BEFORE this runs (see mainForm's
  // submit handler below) — this function only ever takes care of sending the data
  // and showing the success modal / error message.
  function submitViaFormSubmit(form, msgElId, onSuccessKey) {
    var btn = form.querySelector('button[type="submit"]');
    var msgEl = document.getElementById(msgElId);
    msgEl.textContent = "";
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = "…";
    fetch("https://formsubmit.co/ajax/hossin.rate@gmail.com", {
      method: "POST",
      headers: { Accept: "application/json" },
      body: new FormData(form)
    })
      .then(function (res) { if (!res.ok) throw new Error("bad status"); return res.json(); })
      .then(function () {
        openModal(onSuccessKey);
        form.reset();
      })
      .catch(function () { msgEl.textContent = t("submitMsgError"); })
      .finally(function () { btn.disabled = false; btn.textContent = original; });
  }

    // the remaining count, persist it to localStorage, and refresh every on-screen
    // number/progress-bar right away — the visitor sees this instantly, with no
    // need to wait for the network request below to finish.
    decrementSpotsAndRefresh();
    // Now actually send the application data in the background.

  // ---- Live activity toast: rotates a random bilingual "someone just joined" message
  // every 12–18s, stays visible 4s, then fades out. Purely cosmetic social proof — no
  // real data behind it. Paused while the tab is hidden so it never queues up a burst
  // of toasts the visitor comes back to, and skipped entirely under reduced motion.
  var TOAST_KEYS = ["toast1", "toast2", "toast3", "toast4"];
  var liveToastEl = document.getElementById("liveToast");
  var liveToastTextEl = document.getElementById("liveToastText");
  var liveToastCloseBtn = document.getElementById("liveToastClose");
  var toastHideTimer = null;

  var toastManuallyClosed = false;

  function showRandomToast() {
    if (document.hidden) return;
    var key = TOAST_KEYS[Math.floor(Math.random() * TOAST_KEYS.length)];
    liveToastTextEl.textContent = t(key);
    liveToastEl.classList.remove("hidden");
    void liveToastEl.offsetWidth; // force reflow so the opacity transition actually plays
    liveToastEl.classList.remove("opacity-0");
    liveToastEl.classList.add("opacity-100");
    clearTimeout(toastHideTimer);
    toastHideTimer = setTimeout(hideToast, 4000);
  }

  function hideToast() {
    liveToastEl.classList.remove("opacity-100");
    liveToastEl.classList.add("opacity-0");
    setTimeout(function () { liveToastEl.classList.add("hidden"); }, 500); // matches duration-500
  }

  function scheduleNextToast() {
    var delay = 12000 + Math.random() * 6000; // 12–18s
    toastScheduleTimer = setTimeout(function () {
      showRandomToast();
      scheduleNextToast();
    }, delay);
  }

  liveToastCloseBtn.addEventListener("click", function () {
    clearTimeout(toastHideTimer);
    hideToast();
  });

  if (!prefersReducedMotion) {
    scheduleNextToast();
  }

  // ---- Init ----
  applyTranslations("en");
})();
</script>
</body>
</html>
